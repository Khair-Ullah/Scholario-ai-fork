[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"app/services/templates_seed.py" = ["E501"]
"app/services/ai/mock_provider.py" = ["E501"]
"app/services/ai/prompts.py" = ["E501"]