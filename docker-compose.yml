services:
  backend:
    build:
      context: ./backend
    command: sh -c "python -m alembic upgrade head && python -m scripts.seed_templates && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/db/scholario.db}
      FRONTEND_ORIGINS: http://localhost:3000
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      DATA_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/data:/data
      - scholario-db:/data/db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --hostname 0.0.0.0
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ""
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  scholario-db:
  frontend-node-modules:
  frontend-next: